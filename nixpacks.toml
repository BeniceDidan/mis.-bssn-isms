# Tells Railway how to build & start this app (PHP + Node for Vite assets).
# Migrations run on every start — safe/idempotent, and this app has no
# separate release-phase mechanism set up yet.
[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader", "npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
